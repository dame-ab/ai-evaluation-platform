# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# This covers fast, dependency-free hygiene checks only. Linting, type
# checking, and tests run in CI (.github/workflows/ci.yml) instead of here,
# since those need the project's actual virtualenv/node_modules installed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
        exclude: ^frontend/src/client/.*
      - id: trailing-whitespace
        exclude: ^frontend/src/client/.*
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        args: [--force-exclude]
