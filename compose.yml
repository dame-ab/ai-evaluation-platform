# Local development stack: Postgres + the FastAPI backend + the Vite dev
# server for the frontend, plus two small conveniences (Adminer to browse
# the database, Mailpit to view password-reset emails). This is the primary,
# documented way to run the project -- see README "Quick start".
#
# No reverse proxy, TLS, or domain routing here on purpose: this repo is
# meant to be run locally, not deployed (see README "Roadmap").

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changethis}
      POSTGRES_DB: app
    volumes:
      - app-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FASTAPI_ENV: development
      PROJECT_NAME: ${PROJECT_NAME:-AI Evaluation Platform}
      SECRET_KEY: ${SECRET_KEY:-changethis}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-changethis}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changethis}@db:5432/app
      FRONTEND_HOST: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: info@example.com
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the source so `fastapi dev`'s auto-reload picks up edits
      # without rebuilding the image.
      - ./backend/app:/app/app
    # Migrate the (Postgres) database and create the first superuser on every
    # start -- both are no-ops once already applied -- then run the dev
    # server with auto-reload.
    command:
      - sh
      - -c
      - |
        alembic upgrade head &&
        python -m app.initial_data &&
        fastapi dev --host 0.0.0.0 app/main.py

  frontend:
    image: node:26-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  adminer:
    image: adminer
    restart: unless-stopped
    environment:
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "8080:8080"
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  app-db-data:
  frontend-node-modules:
