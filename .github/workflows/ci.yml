name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values for local (SQLite-backed, no Docker) CI runs -- see
  # backend/app/core/config.py and README "Running without Docker".
  FASTAPI_ENV: development
  PROJECT_NAME: "AI Evaluation Platform"
  SECRET_KEY: ci-secret-key-not-for-production-use
  FIRST_SUPERUSER: admin@example.com
  FIRST_SUPERUSER_PASSWORD: ci-only-password-123
  DATABASE_URL: "sqlite:///./ci.db"

jobs:
  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest mypy ty ruff coverage

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: mypy --strict
        run: mypy app

      - name: ty
        run: ty check app

      - name: pytest
        run: coverage run -m pytest tests/ -v

      - name: Coverage report
        run: coverage report

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome (lint + format check)
        run: npx biome check --no-errors-on-unmatched --files-ignore-unknown=true ./

      - name: Type-check and build
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
          - 1025:1025
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e .

      - name: Set up and seed the database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.initial_data

      - name: Start backend
        working-directory: backend
        env:
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_TLS: "false"
          EMAILS_FROM_EMAIL: info@example.com
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          npx --yes wait-on tcp:8000 --timeout 30000

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
          MAILPIT_HOST: http://localhost:8025
          CI: "true"
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-blob-report
          # CI mode uses the 'blob' reporter (see playwright.config.ts); it
          # writes here, not to playwright-report/. Merge locally with
          # `npx playwright merge-reports` to view an HTML report.
          path: frontend/blob-report/
          retention-days: 7
