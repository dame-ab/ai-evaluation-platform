version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns:
          - "*"
  # Python (backend/pyproject.toml)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies]
    groups:
      python-packages:
        patterns:
          - "*"
  # npm (frontend/package.json)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies]
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
    groups:
      npm-packages:
        patterns:
          - "*"
  # Docker (backend image)
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    groups:
      docker:
        patterns:
          - "*"
  # Docker Compose (local dev stack)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    groups:
      docker-compose:
        patterns:
          - "*"
